<style>

    <div style="height: 57px; overflow: hidden; border-top: 1px solid var(--line)"><dc-import name="Main" device="desktop" state="menyimpan" only="bar" hint-size="1440px,57px"></dc-import></div>
  </div>
  <div>
    <p class="wb-cap"><b>Tersimpan.</b> Tiga detik setelah tersimpan, label menambah jam: “Tersimpan 14.02”.</p>
    <div style="height: 57px; overflow: hidden; border-top: 1px solid var(--line)"><dc-import name="Main" device="desktop" state="tersimpan" only="bar" hint-size="1440px,57px"></dc-import></div>
  </div>
  <div>
    <p class="wb-cap"><b>Belum tersinkron.</b> Tinta, bobot 500, ikon awan dicoret, menetap sampai tersambung. Bukan merah. Diketuk: penjelasan singkat.</p>
    <div style="height: 200px; overflow: visible; border-top: 1px solid var(--line)"><dc-import name="Main" device="desktop" state="offline" only="bar" hint-size="1440px,200px"></dc-import></div>
