<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Jelajahi ponsel dan tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ranahmenulis/components/variabel.css">
<link rel="stylesheet" href="ds/ranahmenulis/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
.wb-cap{margin:0;height:40px;display:flex;align-items:center;gap:8px;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.wb-cap b{font-weight:500;color:var(--ink)}
.wb-ph{width:390px;height:844px;overflow:hidden;outline:1px solid var(--line)}
.wb-tb{width:768px;height:1024px;overflow:hidden;outline:1px solid var(--line)}
.wb-row{display:flex;gap:40px;align-items:flex-start}
</style>
</helmet>
<div data-theme="light" style="width: 2540px; min-height: 2000px; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); display: grid; gap: 48px; align-content: start">
  <div class="wb-row">
    <div><p class="wb-cap"><b>Biasa</b> · daftar, bukan grid</p><div class="wb-ph"><dc-import name="Discover" device="mobile" state="biasa" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Tiga kategori</b></p><div class="wb-ph"><dc-import name="Discover" device="mobile" state="tiga" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Memuat</b></p><div class="wb-ph"><dc-import name="Discover" device="mobile" state="memuat" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Kategori kosong</b></p><div class="wb-ph"><dc-import name="Discover" device="mobile" state="kosong" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Galat</b></p><div class="wb-ph"><dc-import name="Discover" device="mobile" state="galat" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Tamu</b> · tanpa bilah bawah</p><div class="wb-ph"><dc-import name="Discover" device="mobile" state="tamu" hint-size="390px,844px"></dc-import></div></div>
  </div>
  <div class="wb-row">
    <div><p class="wb-cap"><b>Gelap</b> · biasa</p><div class="wb-ph"><dc-import name="Discover" device="mobile" theme="dark" state="biasa" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Gelap</b> · memuat</p><div class="wb-ph"><dc-import name="Discover" device="mobile" theme="dark" state="memuat" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Gelap</b> · galat</p><div class="wb-ph"><dc-import name="Discover" device="mobile" theme="dark" state="galat" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Gelap</b> · tamu</p><div class="wb-ph"><dc-import name="Discover" device="mobile" theme="dark" state="tamu" hint-size="390px,844px"></dc-import></div></div>
    <div><p class="wb-cap"><b>Tablet 768</b> · grid dua kolom, rail 72</p><div class="wb-tb"><dc-import name="Discover" device="tablet" state="biasa" hint-size="768px,1024px"></dc-import></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2540,"height":2000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
